<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação pessoal — Thiago</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background-color: #101820;

            /* Background: a imagem cobre toda a página.
               A camada escura mantém o texto branco legível. */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                              url("fundo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Centralização vertical: duas linhas iguais (1fr)
               deixam o conteúdo da linha do meio no centro da página. */
            display: grid;
            grid-template-rows: 1fr auto 1fr;
            gap: 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            align-self: start;

            /* Centralização horizontal do título principal. */
            text-align: center;
        }

        .texto-centro {
            grid-row: 2;
            width: 100%;
            max-width: 680px;

            /* Centralização horizontal do bloco e do texto do parágrafo. */
            justify-self: center;
            text-align: center;
        }

        .texto-centro p {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <h1>Apresentação Pessoal</h1>

    <main class="texto-centro">
        <p>
            Olá! Me chamo Thiago e tenho 19 anos. Atualmente eu faço ADS na faculdade da FMP e amo programação.
            <br>
            Gostaria de conhecer melhor JavaScript para criar páginas web interativas.
        </p>
    </main>
</body>
</html>
